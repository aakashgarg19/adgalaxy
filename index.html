<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/photos/logo.jpeg" />
    <link rel="apple-touch-icon" href="/photos/logo.jpeg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Arcade Digital Galaxy — Delhi's premier wedding & lifestyle photography studio since 1986. Cinematic storytelling for weddings, maternity, newborns, anniversaries and corporate events."
    />
    <meta name="theme-color" content="#0c0b09" />
    <meta property="og:title" content="Arcade Digital Galaxy — Cinematic Photography Studio" />
    <meta
      property="og:description"
      content="Capturing love, light, and legacy since 1986. Wedding, maternity, and lifestyle photography in New Delhi."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&family=Inter:wght@300;400;500;600;700&family=Allura&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply stored theme before paint to avoid flash. Default: dark.
      (function () {
        try {
          var t = localStorage.getItem("adg-theme");
          if (t !== "light") document.documentElement.classList.add("dark");
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <title>Arcade Digital Galaxy — Cinematic Photography Since 1986</title>
  </head>
  <body class="bg-cream text-ink-900 antialiased dark:bg-ink-900 dark:text-cream">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
